name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (editable + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # ── Blocking gates ──────────────────────────────────────────────────
      # Real-bug rules (pyflakes) on the core package: undefined names, unused
      # imports, broken f-strings. Style/format is NOT enforced repo-wide yet —
      # the legacy codebase predates ruff; Phase 2 formats it and flips the
      # advisory steps below to blocking.
      - name: Ruff — real-bug check (core package)
        run: ruff check --select F websearch

      # New code (tests/) is held to the full standard from day one.
      - name: Ruff — lint + format (tests)
        run: |
          ruff check tests
          ruff format --check tests

      - name: pytest
        run: pytest --cov --cov-report=term-missing

      # ── Advisory (non-blocking during the migration) ────────────────────
      - name: Ruff — full lint (advisory)
        continue-on-error: true
        run: ruff check .

      - name: Ruff — full format check (advisory)
        continue-on-error: true
        run: ruff format --check .

      - name: mypy (advisory)
        continue-on-error: true
        run: mypy websearch
