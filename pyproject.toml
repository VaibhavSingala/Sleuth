# ─────────────────────────────────────────────────────────────────────────────
# Sleuth — packaging + tooling, single source of truth.
#
# NOTE ON LAYOUT: the import package is still named `websearch` (flat, top-level)
# at the time of writing, so this file targets it as-is and is usable TODAY:
#     pip install -e ".[dev]"
# When the package is renamed to `src/sleuth` (see docs/ROADMAP + the migration
# plan), change exactly two things, both marked `# RENAME:` below.
# ─────────────────────────────────────────────────────────────────────────────
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sleuth"
version = "1.0.0"
description = "Live web access, recon, and authorised-testing tools for local LLMs, served over MCP."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Vaibhav Singala" }]
keywords = ["mcp", "llm", "security", "recon", "osint", "pentest", "web-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP",
]

# Core runtime deps (mirrors requirements.txt "Core" + always-imported extras).
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
    "ddgs>=9.0",
    "trafilatura>=1.12",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pypdf>=4.0",
    "dnspython>=2.6",
    "primp>=1.0",
    "requests>=2.31",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "sse-starlette>=2.0",
]

[project.optional-dependencies]
# Headless-browser render for JS-only pages (WEBSEARCH_JS_RENDER=true).
# After install: `python -m playwright install chromium`.
js = ["playwright>=1.40"]
# Static APK triage (skills/apk_analyze.py).
apk = ["androguard>=4.1", "pyelftools>=0.31"]
# Pip-installable active scanner (no Java, no separate app).
scan = ["wapiti3>=3.1"]
# Everything a contributor needs to lint, type-check, and test.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-requests",
]

[project.urls]
Homepage = "https://github.com/VaibhavSingala/Sleuth"
Repository = "https://github.com/VaibhavSingala/Sleuth"
Issues = "https://github.com/VaibhavSingala/Sleuth/issues"

[project.scripts]
# MCP server (what LM Studio / run_server.py launch) and the chat web page.
# RENAME: after the move, these become "sleuth.server:main" / "sleuth.webchat:main".
sleuth = "websearch.server:main"
sleuth-chat = "websearch.webchat:main"

[tool.setuptools.packages.find]
# RENAME: after the move, add `where = ["src"]` and change include to ["sleuth*"].
include = ["websearch*"]

# ── Ruff: lint + format (replaces black / isort / flake8) ───────────────────
[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".cache", ".backups", "conversations", "apks", "needle_train/dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
# E501 (line length) is handled by the formatter; B008 is fine for our defaults.
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# Runtime-authored skills and the __main__ CLIs legitimately use print().
"skills/*" = ["T201"]
"**/__main__.py" = ["T201"]

# ── mypy: gradual typing (strict on core, lenient on integrations first) ────
[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true   # many security libs ship no stubs
check_untyped_defs = true
# Tighten module-by-module as the codebase is annotated; start non-blocking.
disallow_untyped_defs = false

# ── pytest ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
branch = true
source = ["websearch"]   # RENAME: "sleuth"
omit = ["*/static/*", "*/__main__.py"]
